name: Create OCI Free Instance

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create OCI API private key
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          echo "$OCI_API_KEY" > oci_api_key.pem
          chmod 600 oci_api_key.pem

      - name: Create OCI config file
        run: |
          echo "[DEFAULT]" > oci_config
          echo "user=${{ secrets.OCI_USER_ID }}" >> oci_config
          echo "fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}" >> oci_config
          echo "tenancy=${{ secrets.OCI_TENANCY_ID }}" >> oci_config
          echo "region=${{ secrets.OCI_REGION }}" >> oci_config
          echo "key_file=${{ github.workspace }}/oci_api_key.pem" >> oci_config

      - name: Create SSH authorized keys file
        run: |
          echo "${{ secrets.SSH_AUTHORIZED_KEYS }}" > id_rsa.pub

      - name: Update oci.env settings
        run: |
          WORKSPACE="${{ github.workspace }}"
          sed -i "s|OCI_CONFIG=.*|OCI_CONFIG=${WORKSPACE}/oci_config|" oci.env
          sed -i "s|SSH_AUTHORIZED_KEYS_FILE=.*|SSH_AUTHORIZED_KEYS_FILE=${WORKSPACE}/id_rsa.pub|" oci.env
          sed -i "s|OCI_SUBNET_ID=|OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}|" oci.env
          sed -i "s|ASSIGN_PUBLIC_IP=false|ASSIGN_PUBLIC_IP=true|" oci.env

      - name: Run instance creation script
        run: python main.py
